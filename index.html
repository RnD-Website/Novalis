<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novalis — Real Estate &amp; Interior Design</title>
  <meta name="description" content="Novalis is a real estate and interior design studio for homes, spaces and living.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="journey" id="journey">
  <section class="hero" aria-labelledby="hero-title">

    <!-- Scene. Exterior photo: assets/hero-scene.png. Interior photo (optional): assets/villa-interior.png -->
    <div class="scene" aria-hidden="true">
      <div class="scene__image"></div>
      <div class="interior">
        <svg class="interior__art" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="i-sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0a2634"/><stop offset=".6" stop-color="#1d4252"/><stop offset="1" stop-color="#b8683a"/>
            </linearGradient>
            <linearGradient id="i-sea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#184456"/><stop offset="1" stop-color="#071a24"/>
            </linearGradient>
            <linearGradient id="i-wall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#1a1410"/><stop offset="1" stop-color="#2b2018"/>
            </linearGradient>
            <linearGradient id="i-floor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3a2a1e"/><stop offset="1" stop-color="#120c08"/>
            </linearGradient>
            <radialGradient id="i-lamp" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#ffd9a0" stop-opacity=".95"/><stop offset=".35" stop-color="#ff9a3c" stop-opacity=".35"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="i-pool" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#ffb868" stop-opacity=".5"/><stop offset="1" stop-color="#ffb868" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="1600" height="900" fill="url(#i-wall)"/>
          <!-- glass wall view -->
          <g>
            <rect x="170" y="90" width="1260" height="500" fill="url(#i-sky)"/>
            <rect x="170" y="340" width="1260" height="250" fill="url(#i-sea)"/>
            <path d="M170 340h1260" stroke="#e08a4a" stroke-opacity=".55" stroke-width="2"/>
            <path d="M170 300l120-20 100 12 140-30 160 24 120-14v68H170z" fill="#0b1f2a" opacity=".85"/>
            <path d="M1100 340l90-40 80-10 160 50z" fill="#09171f"/>
            <g stroke="#9fc7d4" stroke-opacity=".18" fill="none"><path d="M170 400q80-8 160 0t160 0t160 0t160 0t160 0t160 0t160 0"/><path d="M170 450q100-10 200 0t200 0t200 0t200 0"/></g>
            <g stroke="#0c0906" stroke-width="10"><path d="M170 90v500M485 90v500M800 90v500M1115 90v500M1430 90v500"/><path d="M170 90h1260M170 590h1260" stroke-width="14"/></g>
          </g>
          <!-- floor -->
          <path d="M0 590h1600v310H0z" fill="url(#i-floor)"/>
          <ellipse cx="800" cy="720" rx="520" ry="110" fill="url(#i-pool)"/>
          <ellipse cx="820" cy="770" rx="330" ry="52" fill="#4a3624" opacity=".55"/>
          <!-- sofa -->
          <g fill="#1b1410">
            <rect x="250" y="560" width="470" height="110" rx="44"/>
            <rect x="250" y="520" width="470" height="70" rx="34"/>
            <rect x="240" y="540" width="62" height="130" rx="28"/>
            <rect x="670" y="540" width="62" height="130" rx="28"/>
          </g>
          <!-- table + lamp -->
          <ellipse cx="1000" cy="690" rx="110" ry="22" fill="#2c2016"/>
          <rect x="992" y="690" width="16" height="70" fill="#1b1410"/>
          <ellipse cx="1000" cy="770" rx="56" ry="10" fill="#1b1410"/>
          <circle cx="1000" cy="640" r="70" fill="url(#i-lamp)"/>
          <circle cx="1000" cy="660" r="10" fill="#ffe0b0"/>
          <!-- pendants -->
          <g stroke="#0c0906"><path d="M470 0v60M800 0v50M1130 0v60"/></g>
          <g fill="url(#i-lamp)"><circle cx="470" cy="70" r="55"/><circle cx="800" cy="60" r="65"/><circle cx="1130" cy="70" r="55"/></g>
          <g fill="#ffe0b0"><circle cx="470" cy="66" r="7"/><circle cx="800" cy="58" r="8"/><circle cx="1130" cy="66" r="7"/></g>
        </svg>
        <div class="interior__photo"></div>
      </div>
      <div class="bloom"></div>
      <svg class="scene__art" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#06202e"/>
            <stop offset=".35" stop-color="#0b3040"/>
            <stop offset=".7" stop-color="#1b3b46"/>
            <stop offset=".86" stop-color="#6a4330"/>
            <stop offset="1" stop-color="#9a5a2e"/>
          </linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#16394a"/>
            <stop offset=".5" stop-color="#0a2634"/>
            <stop offset="1" stop-color="#051620"/>
          </linearGradient>
          <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1d2a30"/>
            <stop offset="1" stop-color="#070d11"/>
          </linearGradient>
          <radialGradient id="horizon" cx=".1" cy=".5" r=".6">
            <stop offset="0" stop-color="#e0803a" stop-opacity=".55"/>
            <stop offset="1" stop-color="#e0803a" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="pool" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#ff9a3c" stop-opacity=".55"/>
            <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#ffd08a"/>
            <stop offset=".3" stop-color="#ff9a3c" stop-opacity=".6"/>
            <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
          </radialGradient>
          <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
        </defs>

        <rect width="1672" height="941" fill="url(#sky)"/>
        <rect width="1672" height="520" fill="url(#horizon)"/>
        <!-- clouds -->
        <g fill="#0a1d29" opacity=".75" filter="url(#soft)">
          <ellipse cx="180" cy="250" rx="240" ry="22"/><ellipse cx="420" cy="330" rx="300" ry="16"/>
          <ellipse cx="1180" cy="190" rx="260" ry="26"/><ellipse cx="1450" cy="130" rx="260" ry="22"/>
          <ellipse cx="1330" cy="280" rx="200" ry="14"/><ellipse cx="520" cy="130" rx="180" ry="14"/>
        </g>
        <!-- sea -->
        <rect y="420" width="1672" height="521" fill="url(#sea)"/>
        <path d="M0 425H1672" stroke="#d9783a" stroke-opacity=".35" stroke-width="2"/>
        <g stroke="#9fc7d4" stroke-opacity=".18" stroke-width="1.4" fill="none">
          <path d="M0 540q60-8 120 0t120 0t120 0t120 0"/><path d="M0 575q80-10 160 0t160 0t160 0"/>
          <path d="M80 610q70-9 140 0t140 0t140 0"/><path d="M0 500q50-6 100 0t100 0t100 0t100 0"/>
        </g>
        <!-- distant headlands -->
        <path d="M1040 425l60-22 90-6 80 18 60-10 100 20v40H1040z" fill="#0c1f2a"/>
        <!-- sea stacks -->
        <path d="M430 548l20-80 18-34 22-8 20 22 8 58 18 40z" fill="url(#rock)"/>
        <path d="M562 548l10-20 22-10 24 16 4 14z" fill="url(#rock)"/>
        <path d="M1062 538l20-48 18-52 24-10 18 40 18 24 22 18 16 28z" fill="url(#rock)"/>
        <path d="M150 576h150l-20-10-40-8-60 4z" fill="#0a171e"/>
        <path d="M0 592q80-24 160-12t110 4v14H0z" fill="#0a171e"/>
        <!-- right cliff -->
        <path d="M1240 500l30-90 40-80 60-40 100-4 172 4v760H1240z" fill="url(#rock)"/>
        <path d="M1280 560l60-80 90-30 242-10v220l-100 90-120-30z" fill="#0d171c"/>
        <!-- platform -->
        <path d="M420 640l120-70 80-30 300-12 220 4 130 30 190 26 60 40v250H420z" fill="#0a1217"/>
        <ellipse cx="900" cy="590" rx="360" ry="46" fill="#1c262b"/>
        <ellipse cx="900" cy="585" rx="335" ry="37" fill="#0b1c25"/>
        <ellipse cx="900" cy="582" rx="300" ry="30" fill="url(#pool)"/>
        <ellipse cx="900" cy="584" rx="200" ry="16" fill="none" stroke="#ffb868" stroke-opacity=".35"/>
        <ellipse cx="900" cy="584" rx="120" ry="9" fill="none" stroke="#ffb868" stroke-opacity=".3"/>
        <!-- steps -->
        <g fill="#141f25">
          <path d="M1260 600h200l30 14h-210z"/><path d="M1300 626h190l30 14h-200z"/>
          <path d="M1400 560l120-4v-40l60 30-4 30z"/>
        </g>
        <!-- house -->
        <g>
          <rect x="1500" y="222" width="172" height="86" fill="#243038"/>
          <rect x="1500" y="222" width="172" height="8" fill="#37444c"/>
          <path d="M1458 316h214v108h-214z" fill="#1a232a"/>
          <path d="M1468 316h204v104h-204z" fill="#b8652b"/>
          <rect x="1468" y="316" width="204" height="104" fill="url(#lamp)" opacity=".45"/>
          <rect x="1540" y="322" width="54" height="86" fill="#1b2227"/>
          <rect x="1600" y="330" width="60" height="78" fill="#e08a3c" opacity=".7"/>
          <circle cx="1551" cy="395" r="14" fill="#ffd9a0"/>
          <circle cx="1551" cy="395" r="46" fill="url(#lamp)" opacity=".7"/>
          <path d="M1456 424h216v14h-216z" fill="#101a20"/>
        </g>
        <!-- lamps -->
        <g id="lamps" fill="url(#lamp)">
          <circle cx="1250" cy="540" r="16"/><circle cx="1392" cy="540" r="14"/><circle cx="1292" cy="634" r="14"/>
          <circle cx="1124" cy="634" r="12"/><circle cx="750" cy="600" r="12"/><circle cx="617" cy="590" r="10"/>
          <circle cx="1628" cy="422" r="12"/><circle cx="1430" cy="470" r="9"/>
        </g>
        <!-- foreground ground + rock -->
        <path d="M0 700q140-60 300-40t200 20l-40 261H0z" fill="#0a0e10"/>
        <path d="M1090 941l40-120 110-70 150-10 40 200z" fill="#05080a"/>
        <g id="grass"></g>
        <rect y="760" width="1672" height="181" fill="#000" opacity=".28"/>
      </svg>
      <div class="scene__vignette"></div>
    </div>

    <header class="nav">
      <a class="nav__logo" href="#" aria-label="Novalis, home">
        <span>Novalis</span><small>Estates &amp; Interiors</small>
      </a>

      <nav class="nav__links" id="primary-nav" aria-label="Primary">
        <a href="#properties"><span>Properties</span></a>
        <a href="#interiors"><span>Interiors</span></a>
        <a href="#services"><span>Services</span></a>
        <a href="#journal"><span>Journal</span></a>
      </nav>

      <a class="nav__cta" href="#contact">
        <span>Book a viewing</span>
        <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true" focusable="false"><path d="M1 6h10M7 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </a>

      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open menu">
        <span class="nav__toggle-label">Menu</span><span class="nav__toggle-bars"><i></i><i></i></span>
      </button>
    </header>

    <div class="mark" aria-hidden="true">
      <canvas id="particles"></canvas>
    </div>

    <p class="intro">Real estate &amp; interior design /<br>Homes, spaces, living</p>

    <h1 class="headline" id="hero-title">
      <span>Spaces you want</span>
      <span>to come home to</span>
    </h1>

    <div class="interior-ui" id="interiors">
      <div class="interior-copy">
        <p class="eyebrow"><span class="eyebrow__no">02</span><i></i><span>The villa &nbsp;/&nbsp; Living</span></p>
        <p class="caption"><span>Light, stone and the <em>sound of the sea.</em></span></p>
      </div>

      <div class="hotspots">
        <button class="hs" type="button" data-u=".24" data-v=".23" aria-label="Handblown pendants">
          <span class="hs__tag"><b>1</b><span class="hs__label">Pendants</span><i class="hs__plus"></i></span>
          <span class="hs__card">
            <span class="hs__img" style="background-position:12% 11%"></span>
            <span class="hs__body">
              <small>Lighting</small>
              <strong>Handblown <em>pendants</em></strong>
              <span>Amber glass, finished by hand in small batches.</span>
              <i class="hs__spec"><span>Material</span>Murano glass</i>
            </span>
            <span class="hs__more">View details <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M1 6h10M7 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1"/></svg></span>
          </span>
        </button>
        <button class="hs" type="button" data-u=".19" data-v=".52" aria-label="Bespoke seating">
          <span class="hs__tag"><b>2</b><span class="hs__label">Seating</span><i class="hs__plus"></i></span>
          <span class="hs__card">
            <span class="hs__img" style="background-position:5% 53%"></span>
            <span class="hs__body">
              <small>Furniture</small>
              <strong>Bespoke <em>seating</em></strong>
              <span>Bouclé and travertine, made to measure for the room.</span>
              <i class="hs__spec"><span>Material</span>Wool bouclé</i>
            </span>
            <span class="hs__more">View details <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M1 6h10M7 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1"/></svg></span>
          </span>
        </button>
        <button class="hs" type="button" data-u=".62" data-v=".28" aria-label="Curved glazing">
          <span class="hs__tag"><b>3</b><span class="hs__label">Glazing</span><i class="hs__plus"></i></span>
          <span class="hs__card">
            <span class="hs__img" style="background-position:69% 18%"></span>
            <span class="hs__body">
              <small>Architecture</small>
              <strong>Curved <em>glazing</em></strong>
              <span>Frameless panes for an uninterrupted view of the sea.</span>
              <i class="hs__spec"><span>Height</span>3.2 m</i>
            </span>
            <span class="hs__more">View details <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M1 6h10M7 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1"/></svg></span>
          </span>
        </button>
        <button class="hs" type="button" data-u=".74" data-v=".74" aria-label="Honed travertine floors">
          <span class="hs__tag"><b>4</b><span class="hs__label">Travertine</span><i class="hs__plus"></i></span>
          <span class="hs__card">
            <span class="hs__img" style="background-position:84% 85%"></span>
            <span class="hs__body">
              <small>Materials</small>
              <strong>Honed <em>travertine</em></strong>
              <span>Warm underfoot, with underfloor heating throughout.</span>
              <i class="hs__spec"><span>Origin</span>Italian stone</i>
            </span>
            <span class="hs__more">View details <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M1 6h10M7 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1"/></svg></span>
          </span>
        </button>
      </div>
    </div>

    <ol class="rail" aria-hidden="true">
      <li class="is-on"><i></i><span>Exterior</span></li>
      <li><i></i><span>Interior</span></li>
    </ol>

    <div class="scroll-cue" aria-hidden="true"><span>Scroll</span><i></i></div>
  </section>
  </div>

  <script src="hero.js"></script>
</body>
</html>
